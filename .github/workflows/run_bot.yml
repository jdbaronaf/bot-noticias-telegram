name: Bot de Noticias Telegram

on:
  schedule:
    # Se ejecuta automáticamente cada 5 minutos
   # - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install feedparser python-telegram-bot requests openpyxl

    - name: Ejecutar Script de Noticias
      run: python noticias.py

    - name: Guardar base de datos y Excel actualizados en GitHub
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Actualización automática de base de datos y registro de noticias"
        file_pattern: noticias_enviadas.db noticias_registro.xlsx
        skip_empty_commit: true

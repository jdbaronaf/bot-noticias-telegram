name: Bot de Noticias Telegram

on:
  schedule:
    # Se ejecuta todos los días a las 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install feedparser python-telegram-bot requests openpyxl

    - name: Ejecutar Script de Noticias
      run: python noticias.py
